name: Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Generate version info
        id: version
        run: |
          DATE=$(date +'%Y.%m.%d')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "tag=v${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=${DATE}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # ---- Debug APK (PR only) ----
      - name: Build Debug APK
        if: github.event_name == 'pull_request'
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ---- Release APK + GitHub Release (push to main/master) ----
      - name: Decode Keystore
        if: github.event_name == 'push'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Build Release APK
        if: github.event_name == 'push'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        if: github.event_name == 'push'
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/X下载器-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: X下载器 ${{ steps.version.outputs.name }}
          body: |
            ## X下载器 ${{ steps.version.outputs.name }}

            **版本号**: ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})

            ### 安装说明
            下载下方 APK 文件，传输到手机安装即可。

            ### 更新内容
            ${{ github.event.head_commit.message }}

            ---
            *构建自 `${{ github.sha }}`*
          files: |
            app/build/outputs/apk/release/X下载器-${{ steps.version.outputs.name }}.apk
          draft: false
          prerelease: false
